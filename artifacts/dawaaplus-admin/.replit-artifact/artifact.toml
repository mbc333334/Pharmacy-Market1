kind = "web"
previewPath = "/dawaaplus-admin/"
title = "دواء+ — لوحة مدير المنصة"
version = "1.0.0"
id = "artifacts/dawaaplus-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dawaaplus-admin/" ]
localPort = 21641

[services.development]
run = "pnpm --filter @workspace/dawaaplus-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dawaaplus-admin", "run", "build" ]
publicDir = "artifacts/dawaaplus-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21641"
BASE_PATH = "/dawaaplus-admin/"
