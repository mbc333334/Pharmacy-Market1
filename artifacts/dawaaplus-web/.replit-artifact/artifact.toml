kind = "web"
previewPath = "/dawaaplus-web/"
title = "دواء+ — بوابة الإدارة"
version = "1.0.0"
id = "artifacts/dawaaplus-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dawaaplus-web/" ]
localPort = 20630

[services.development]
run = "pnpm --filter @workspace/dawaaplus-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dawaaplus-web", "run", "build" ]
publicDir = "artifacts/dawaaplus-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20630"
BASE_PATH = "/dawaaplus-web/"
