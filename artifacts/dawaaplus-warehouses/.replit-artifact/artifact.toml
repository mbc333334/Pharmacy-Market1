kind = "web"
previewPath = "/dawaaplus-warehouses/"
title = "دواء+ | بوابة المذاخر"
version = "1.0.0"
id = "artifacts/dawaaplus-warehouses"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dawaaplus-warehouses/" ]
localPort = 20355

[services.development]
run = "pnpm --filter @workspace/dawaaplus-warehouses run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dawaaplus-warehouses", "run", "build" ]
publicDir = "artifacts/dawaaplus-warehouses/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20355"
BASE_PATH = "/dawaaplus-warehouses/"
